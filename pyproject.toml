[project]
name = "grpc-timeseries"
version = "3.2.0"
description = "gRPC time-series service backed by Redis"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "grpcio>=1.85",
    "grpcio-health-checking>=1.85",
    "grpcio-tools>=1.85",
    "protobuf>=7.36.2",
    "redis>=8.1.0",
    "watchfiles>=1.3.0",
    "urllib3>=2.8.0"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1"
]

[tool.uv]
constraint-dependencies = [
    "grpcio>=1.85",
    "grpcio-tools>=1.85",
]
package = true

[project.scripts]
grpc-timeseries = "grpc_timeseries.server:serve"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v -s"
pythonpath = ["src", "src/grpc_timeseries/generated"]
